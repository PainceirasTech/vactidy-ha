# Limpieza por mapa del Vactidy Cleanova W15 para Home Assistant.
#
# Instalacion (ver ha/README.md, o ejecuta ha/instalar.sh dentro del contenedor).
#
# Cada mapa se sirve desde la propia instancia de Home Assistant, asi que no
# depende de ningun PC encendido ni de la nube de Tuya.
#
# Nota: shell_command exige una CADENA, no una lista. Los argumentos se pasan
# en una sola linea y las credenciales se leen de /config/scripts/vactidy.env.

shell_command:
  vactidy_limpiar_salon: >-
    set -a; . /config/scripts/vactidy.env; set +a; exec python3
    /config/scripts/vactidy_room.py --retries 6
    --map 64542
    --url http://192.168.5.250:8123/local/vactidy/salon.txt
    --auto

  vactidy_limpiar_cocina: >-
    set -a; . /config/scripts/vactidy.env; set +a; exec python3
    /config/scripts/vactidy_room.py --retries 6
    --map 58757
    --url http://192.168.5.250:8123/local/vactidy/cocina.txt
    --auto

  vactidy_parar: >-
    set -a; . /config/scripts/vactidy.env; set +a; exec python3
    /config/scripts/vactidy_room.py --retries 6
    --stop-dock

script:
  limpiar_salon:
    alias: Limpiar salon
    icon: mdi:robot-vacuum
    mode: single
    sequence:
      - action: shell_command.vactidy_limpiar_salon

  limpiar_cocina:
    alias: Limpiar cocina
    icon: mdi:robot-vacuum
    mode: single
    sequence:
      - action: shell_command.vactidy_limpiar_cocina

  vactidy_parar:
    alias: Parar el robot y mandarlo a la base
    icon: mdi:home-import-outline
    mode: single
    sequence:
      - action: shell_command.vactidy_parar
